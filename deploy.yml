name: Deploy PathVision

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Deploy backend to Modal ─────────────────────────────────────────────────
  deploy-modal:
    name: Modal backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Deploy
        env:
          MODAL_TOKEN_ID:     ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy pathvision_modal.py

      - name: Get endpoint URL
        env:
          MODAL_TOKEN_ID:     ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          URL=$(modal app list --json | python3 -c "
          import json,sys
          apps = json.load(sys.stdin)
          url = next((a['url'] for a in apps if a['name']=='pathvision'), '')
          print(url)
          ")
          echo "MODAL_URL=$URL" >> $GITHUB_ENV
          echo "Backend live at: $URL"

  # ── Deploy frontend to Vercel ──────────────────────────────────────────────
  deploy-vercel:
    name: Vercel frontend
    runs-on: ubuntu-latest
    needs: deploy-modal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.MODAL_API_URL }}
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:   ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:  ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod"
